summary: >-
  Kolide publishes NO first-party HTTP client SDK for the K2 API in any language.
  Its public first-party Go modules are the open-source device agent (launcher) and a
  shared internal toolkit (kit), not API client libraries. The official MCP server is
  distributed as source from GitHub only — it is not published to PyPI. The one npm
  package matching "kolide" is a third-party re-implementation, not first-party.
