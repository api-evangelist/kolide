aid: kolide
name: Kolide
description: >-
  Kolide is a device trust and endpoint security platform, now part of 1Password Extended
  Access Management. It enforces Zero Trust access by blocking non-compliant devices from
  authenticating into corporate applications through Okta, Google Workspace or Microsoft
  Entra, runs continuous security and compliance checks across Linux, macOS, Windows, iOS
  and Android endpoints, and maintains fleet-wide device inventory built on thousands of
  osquery-sourced data points. Its distinguishing philosophy is user-first remediation:
  rather than silently denying access, Kolide educates the end user about the specific
  problem on their device and guides them through fixing it themselves, cutting helpdesk
  load. The public developer surface is the K2 API at api.kolide.com — 65 REST operations
  across devices, people, groups, security checks, compliance issues, live osquery
  campaigns, approval queues, reporting tables and audit logs — published as OpenAPI 3.0
  on dated version lines, with HMAC-signed webhooks, an OpenID Shared Signals Framework
  (CAEP) event stream, and a first-party MCP server.
