generated: '2026-07-19'
method: searched
status: published
source: https://www.kolide.com/docs/developers/kolide-mcp-server
repository: https://github.com/kolide/device-trust-mcp-server
server:
  name: kolide
  title: 1Password Device Trust (Kolide K2) MCP Server
  transport:
  - stdio
  - http
  hosted: false
  local_url: http://127.0.0.1:8000/mcp
  install:
  - git clone https://github.com/kolide/device-trust-mcp-server.git
  - uv sync
  - uv run kolide-mcp
  authentication:
    KOLIDE_API_KEY: Kolide API key from Dashboard > Settings > Developers > API Keys
    MCP_AUTH_TOKEN: Bearer token the operator generates for the MCP HTTP listener
  configuration:
    KOLIDE_API_URL: https://api.kolide.com
    KOLIDE_API_VERSION: '2026-04-07'
    MCP_MAX_ENRICH_RECORDS: 500
features:
- Auto-pagination via a `fetch_all` parameter on list tools
- Field projection via a `fields` parameter to trim response size
- Device owner enrichment via `enrich_device_owner`, injecting owner_name/owner_email
- Dated API-version pinning sent as X-Kolide-Api-Version on every upstream request
resources:
- uri: kolide://docs/search-syntax
  description: Search query syntax, operators and per-endpoint field names
- uri: kolide://docs/reporting-tables
  description: Reporting table overview with efficient querying tips
- uri: kolide://docs/workflows
  description: Step-by-step guides for common analytical tasks
tools:
- name: kolide_issue_resolution_stats
  group: composite
  description: Compute resolution time statistics (avg, median, min, max, p90) for issues of a specific
    check. Automatically fetches all pages.
- name: kolide_count_table_records_by_field
  group: composite
  description: Count records in a reporting table grouped by a field. Returns ranked results.
- name: kolide_refresh_reporting_tables
  group: composite
  description: Refresh the cached list of valid reporting table names from the API.
- name: kolide_whoami
  group: organization
  description: Get organization information
  source_operation: GET /whoami
